name: Extended security scans

on:
  push:
    branches:
      - main
      - "security-tooling/**"
      - "features/**"
      - "design/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
      - "publication/app2-clean-2026-11-18"
      - "audit/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep Community Edition
        run: |
          docker run --rm \
            -e SEMGREP_SEND_METRICS=off \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            semgrep/semgrep:1.187.0 \
            semgrep scan --config p/security-audit --sarif --output /src/semgrep.sarif --error .

      - name: Upload Semgrep results to GitHub code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif

  gitleaks-files:
    name: Gitleaks current source scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create clean source snapshot without Git objects
        run: |
          mkdir -p "$RUNNER_TEMP/app2-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/app2-source"

      - name: Scan current source files for exposed secrets
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/app2-source:/src:ro" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /src \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --config /src/gitleaks.toml --redact=100 --report-format=sarif \
              --report-path=/workspace/gitleaks.sarif --no-banner /src

      - name: Summarize redacted Gitleaks findings
        if: always() && hashFiles('gitleaks.sarif') != ''
        run: |
          python - <<'PY'
          import json
          import os

          with open("gitleaks.sarif", encoding="utf-8") as report_file:
              report = json.load(report_file)

          findings = [
              finding
              for run in report.get("runs", [])
              for finding in run.get("results", [])
          ]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### Gitleaks current-source findings: {len(findings)}\\n")
              for finding in findings:
                  physical = (
                      (finding.get("locations") or [{}])[0]
                      .get("physicalLocation", {})
                  )
                  artifact = physical.get("artifactLocation", {})
                  region = physical.get("region", {})
                  rule = finding.get("ruleId", "unknown")
                  path = artifact.get("uri", "unknown")
                  line = region.get("startLine", "unknown")
                  entry = f"- Rule `{rule}`; file `{path}`; line `{line}`"
                  print(entry)
                  summary.write(entry + "\\n")
          PY

      - name: Upload redacted Gitleaks results to GitHub code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif

  gitleaks-history:
    name: Gitleaks full Git history audit
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/design/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all available Git refs for historical secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config /repo/gitleaks.toml --log-opts="--all" --redact=100 --report-format=sarif \
              --report-path=/repo/gitleaks-history.sarif --no-banner /repo

      - name: Upload redacted historical Gitleaks results to GitHub code scanning
        if: always() && hashFiles('gitleaks-history.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks-history.sarif

  osv-scanner:
    name: OSV dependency vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependency manifests and lockfiles with OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1

  trivy:
    name: Trivy filesystem and configuration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependencies, IaC configuration and secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            aquasec/trivy:0.76.2 \
            fs --scanners vuln,misconfig,secret \
              --severity HIGH,CRITICAL --exit-code 1 \
              --format sarif --output /workspace/trivy.sarif \
              --skip-dirs .git /workspace

      - name: Summarize redacted Trivy findings
        if: always() && hashFiles('trivy.sarif') != ''
        run: |
          python - <<'PY'
          import json
          import os

          with open("trivy.sarif", encoding="utf-8") as report_file:
              report = json.load(report_file)

          summaries = []
          for run in report.get("runs", []):
              rules = {
                  rule.get("id"): rule
                  for rule in run.get("tool", {}).get("driver", {}).get("rules", [])
              }
              for finding in run.get("results", []):
                  rule_id = finding.get("ruleId", "unknown")
                  rule = rules.get(rule_id, {})
                  short = rule.get("shortDescription", {}).get("text", "")
                  severity = (
                      rule.get("properties", {}).get("security-severity")
                      or finding.get("level", "unknown")
                  )
                  physical = (
                      (finding.get("locations") or [{}])[0]
                      .get("physicalLocation", {})
                  )
                  artifact = physical.get("artifactLocation", {})
                  region = physical.get("region", {})
                  path = artifact.get("uri", "unknown")
                  line = region.get("startLine", "unknown")
                  summaries.append(
                      f"- Rule `{rule_id}`; severity `{severity}`; "
                      f"file `{path}`; line `{line}`; {short}"
                  )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### Trivy high/critical findings: {len(summaries)}\\n")
              for entry in summaries:
                  print(entry)
                  summary.write(entry + "\\n")
          PY

      - name: Upload Trivy results to GitHub code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif

  web-container:
    name: Build and smoke-test the unprivileged frontend container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build frontend container
        run: docker build --pull --tag app2-web:ci .

      - name: Verify frontend container uses the unprivileged UID and GID
        shell: bash
        run: |
          actual_user="$(docker image inspect app2-web:ci --format '{{.Config.User}}')"
          echo "Frontend container user: ${actual_user}"
          test "${actual_user}" = "101:101"

      - name: Smoke-test frontend on its internal unprivileged port
        shell: bash
        run: |
          set -euo pipefail
          docker network create app2-web-ci
          trap 'docker rm --force app2-web-ci app2-api-stub >/dev/null 2>&1 || true; docker network rm app2-web-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name app2-api-stub --network app2-web-ci --network-alias api node:22-alpine node -e "require('node:http').createServer((req,res)=>{res.end('stub')}).listen(8000,'0.0.0.0')"
          docker run --detach --name app2-web-ci --network app2-web-ci --publish 18080:8080 app2-web:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ -o /dev/null; then
              echo "Frontend responded successfully on the mapped host port."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready on port 18080."
          docker logs app2-web-ci
          docker logs app2-api-stub
          exit 1

      - name: Validate training and production Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          export POSTGRES_DB=app2_test POSTGRES_USER=app2_test POSTGRES_PASSWORD=ci-only-password
          export FRONTEND_ORIGIN=http://127.0.0.1:8080 DATABASE_SSL=false
          export JWT_SECRET=ci-only-jwt-secret-value-with-sufficient-length JWT_EXPIRES_IN=8h
          export DOCUMENT_STORAGE_PATH=/tmp/app2-documents MAX_UPLOAD_MB=100
          export APP_BIND_ADDRESS=127.0.0.1 APP_PORT=8080
          docker compose -f docker-compose.yml config --quiet
          export FRONTEND_ORIGIN=https://app2.example.invalid
          docker compose -f docker-compose.production.yml config --quiet

      - name: Scan built frontend image for HIGH and CRITICAL vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:0.76.2 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
              --format sarif --output /workspace/trivy-image.sarif app2-web:ci

      - name: Summarize redacted frontend image findings
        if: always() && hashFiles('trivy-image.sarif') != ''
        run: |
          python - <<'PY'
          import json
          import os

          with open("trivy-image.sarif", encoding="utf-8") as report_file:
              report = json.load(report_file)

          entries = []
          for run in report.get("runs", []):
              rules = {
                  rule.get("id"): rule
                  for rule in run.get("tool", {}).get("driver", {}).get("rules", [])
              }
              for finding in run.get("results", []):
                  rule_id = finding.get("ruleId", "unknown")
                  rule = rules.get(rule_id, {})
                  short = rule.get("shortDescription", {}).get("text", "")
                  severity = (
                      rule.get("properties", {}).get("security-severity")
                      or finding.get("level", "unknown")
                  )
                  entries.append(
                      f"- Rule `{rule_id}`; severity `{severity}`; {short}"
                  )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### Trivy frontend image findings: {len(entries)}\\n")
              for entry in entries:
                  print(entry)
                  summary.write(entry + "\\n")
          PY

      - name: Upload frontend image scan results to GitHub code scanning
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif

  app2-tests:
    name: Windows build and regression tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install frontend and run production build
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build -- --configLoader runner

      - name: Install backend and run syntax checks and regression suite
        shell: pwsh
        env:
          DATABASE_URL: postgresql://app2_test:app2_test@127.0.0.1:5432/app2_test
          JWT_SECRET: app2-ci-test-only-secret-not-used-outside-this-run
        run: |
          Push-Location backend
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            npm run check
            npm test
          }
          finally {
            Pop-Location
          }

  production-migration-postgres17:
    name: PostgreSQL 17 production migration integration test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: app2_migration_test
          POSTGRES_USER: app2_test
          POSTGRES_PASSWORD: app2-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app2_test -d app2_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply the production baseline and migrations to an empty PostgreSQL 17 database
        working-directory: backend
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://app2_test:app2-ci-only-password@127.0.0.1:5432/app2_migration_test
          JWT_SECRET: app2-ci-only-secret-for-postgresql-migration-smoke
          FRONTEND_ORIGIN: https://app2.example.invalid
        run: |
          npm run db:migrate:production
          npm run db:migrate:production

      - name: Verify the baseline ledger and migration history
        working-directory: backend
        env:
          DATABASE_URL: postgresql://app2_test:app2-ci-only-password@127.0.0.1:5432/app2_migration_test
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg'
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL })
          await client.connect()
          try {
            const result = await client.query(`
              SELECT COUNT(*)::int AS count,
                BOOL_OR(migration_id = 'baseline:src/schema.sql') AS baseline_applied
              FROM public.redesy_schema_migrations
            `)
            const row = result.rows[0]
            if (!row.baseline_applied || row.count < 14) {
              throw new Error(`Expected the baseline and 13 pinned migrations; received ${row.count} ledger rows.`)
            }
            console.log(`Verified baseline and ${row.count - 1} migration records.`)
          } finally {
            await client.end()
          }
          NODE
