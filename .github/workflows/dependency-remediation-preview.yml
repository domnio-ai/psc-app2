name: APP2 dependency remediation preview

on:
  push:
    branches:
      - "security-tooling/app2-scanners-2026-11-25"

permissions:
  contents: read

jobs:
  preview-and-test:
    name: Trial compatible dependency updates and app2 tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate candidate dependency manifests and validate production build
        id: generate-candidates
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            node:22-alpine sh -euxc '
              npm pkg set "dependencies.vite=^7.3.7"
              npm pkg set "overrides.postcss.source-map-js=1.2.4"
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              npm ci --ignore-scripts --no-audit --no-fund
              npm ls vite postcss source-map-js
              npm run build -- --configLoader runner

              cd backend
              npm pkg set "overrides.exceljs.uuid=11.1.1"
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              npm ci --ignore-scripts --no-audit --no-fund
              npm ls uuid --all
              npm run check
            '

      - name: Upload candidate manifests and lockfiles for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app2-remediated-dependency-files
          path: |
            package.json
            package-lock.json
            backend/package.json
            backend/package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Run app2 backend regression suite with required PDF fonts and test configuration
        if: always() && steps.generate-candidates.outcome == 'success'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/backend \
            node:22-alpine sh -euxc '
              apk add --no-cache fontconfig ttf-liberation
              FONT_DIR="$(dirname "$(find /usr/share/fonts -name LiberationSerif-Regular.ttf -print -quit)")"
              test -f "$FONT_DIR/LiberationSerif-Regular.ttf"
              test -f "$FONT_DIR/LiberationSerif-Bold.ttf"
              test -f "$FONT_DIR/LiberationSerif-Italic.ttf"
              test -f "$FONT_DIR/LiberationSerif-BoldItalic.ttf"
              export PSC_TIMES_NEW_ROMAN_DIR="$FONT_DIR"
              export DATABASE_URL="postgresql://app2_test:app2_test@127.0.0.1:5432/app2_test"
              export JWT_SECRET="app2-ci-test-only-secret-not-used-outside-this-run"
              npm test
            '
