services:
  db:
    image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8000
      NODE_ENV: production
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set public HTTPS origin in .env.production}
      EXPOSE_LOGIN_DIRECTORY: "false"
      FELIX_INDEX_WORKER_ENABLED: ${FELIX_INDEX_WORKER_ENABLED:-false}
      REPORT_SCHEDULER_ENABLED: ${REPORT_SCHEDULER_ENABLED:-false}
      NOTICE_EXPIRY_WORKER_ENABLED: ${NOTICE_EXPIRY_WORKER_ENABLED:-false}
      RESEARCH_LIFECYCLE_RECONCILIATION_ENABLED: ${RESEARCH_LIFECYCLE_RECONCILIATION_ENABLED:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET in .env.production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      UPLOAD_DIR: /app/uploads
      DOCUMENT_STORAGE_PATH: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - production_uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"

volumes:
  production_postgres_data:
    name: psc_redesy_production_postgres_data
  production_uploads_data:
    name: psc_redesy_production_uploads_data
