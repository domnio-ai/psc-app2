services:
  db:
    image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8000
      NODE_ENV: production
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      EXPOSE_LOGIN_DIRECTORY: "false"
      FELIX_INDEX_WORKER_ENABLED: "false"
      REPORT_SCHEDULER_ENABLED: "false"
      NOTICE_EXPIRY_WORKER_ENABLED: "false"
      RESEARCH_LIFECYCLE_RECONCILIATION_ENABLED: "false"

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: ${DATABASE_SSL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      UPLOAD_DIR: /app/uploads
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      SMTP_ENABLED: "false"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS}:${APP_PORT}:8080"

volumes:
  postgres_data:
    name: psc_app2_training_postgres_data
  uploads_data:
    name: psc_app2_training_uploads_data
